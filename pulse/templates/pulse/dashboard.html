<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel.pulse() - Real-Time Anomaly Detection</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #00ff88;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid #00ff8833;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            text-shadow: 0 0 20px #00ff88;
        }

        .status {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #888;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
        }

        .chart-container {
            background: #111;
            border: 1px solid #00ff8833;
            border-radius: 10px;
            padding: 20px;
        }

        .sidebar {
            background: #111;
            border: 1px solid #00ff8833;
            border-radius: 10px;
            padding: 20px;
        }

        .current-value {
            font-size: 3rem;
            text-align: center;
            padding: 20px;
            text-shadow: 0 0 30px currentColor;
        }

        .current-value.normal {
            color: #00ff88;
        }

        .current-value.anomaly {
            color: #ff0055;
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .incident-log {
            margin-top: 20px;
        }

        .incident-log h3 {
            margin-bottom: 10px;
            color: #ff0055;
        }

        .incident-log ul {
            list-style: none;
            max-height: 300px;
            overflow-y: auto;
        }

        .incident-log li {
            padding: 8px;
            margin-bottom: 5px;
            background: #ff005511;
            border-left: 3px solid #ff0055;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>sentinel.pulse()</h1>
            <div class="status">Real-Time Streaming Anomaly Detection Pipeline</div>
        </header>

        <div class="dashboard">
            <div class="chart-container">
                <canvas id="pulseChart"></canvas>
            </div>

            <div class="sidebar">
                <div id="currentValue" class="current-value normal">--°C</div>
                <div class="incident-log">
                    <h3>Incident Log</h3>
                    <ul id="incidentLog"></ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('pulseChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'CPU Temp (°C)',
                    data: [],
                    borderColor: '#00ff88',
                    backgroundColor: '#00ff8833',
                    borderWidth: 2,
                    pointRadius: 0,
                    fill: true,
                    tension: 0.1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        grid: { color: '#00ff8822' },
                        ticks: { color: '#00ff88' }
                    },
                    y: {
                        min: 30,
                        max: 100,
                        grid: { color: '#00ff8822' },
                        ticks: { color: '#00ff88' }
                    }
                },
                plugins: {
                    legend: { labels: { color: '#00ff88' } }
                }
            }
        });

        const streamSocket = new WebSocket('ws://' + window.location.host + '/ws/stream/');

        streamSocket.onmessage = function(e) {
            const data = JSON.parse(e.data);
            console.log('Received:', data);
        };

        streamSocket.onclose = function(e) {
            console.error('WebSocket closed');
        };
    </script>
</body>
</html>
